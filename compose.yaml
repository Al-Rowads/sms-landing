services:
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  app:
    image: sms-landing:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      VISITOR_IP_HASH_KEY: "${VISITOR_IP_HASH_KEY:?Set VISITOR_IP_HASH_KEY to a 64-character hexadecimal secret}"
    expose:
      - "3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
